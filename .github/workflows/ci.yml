name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.1', '8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: curl, json, mbstring, intl
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Lint module and views
        run: find components tests -name '*.php' -o -name '*.pdt' | xargs -n1 php -l > /dev/null

      - name: Validate config.json
        run: php -r 'json_decode(file_get_contents("components/modules/domain_reseller_api/config.json"), false, 512, JSON_THROW_ON_ERROR);'

      - name: Run tests
        run: vendor/bin/phpunit --colors=always
